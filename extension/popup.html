<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 18rem; margin: 0; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  input, button { font: inherit; width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 8px; }
  button { cursor: pointer; border: 0; border-radius: 4px; background: #1d4ed8; color: #fff; }
  button.stop { background: #b91c1c; }
  #status { color: #444; white-space: pre-wrap; }
  #status.err { color: #b91c1c; }
</style>
<h1>Showrun Recorder</h1>
<input id="title" placeholder="What are you teaching? e.g. Resolve a complaint" aria-label="Task name">
<button id="toggle">Start recording</button>
<div id="status" role="status"></div>
<script src="popup.js"></script>
